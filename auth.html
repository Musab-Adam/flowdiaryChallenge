<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Authenthication</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js" integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO" crossorigin="anonymous"></script>
    <script src="auth.js"></script>
    <style>
        .btn{
            background-color: black;
            color: aliceblue;
        }
        .btn-link{
            text-decoration: none;
            color: white;
        }
        .btn:hover{
            background-color: black;
            color: white;
        }
    </style>
</head>
<body class="bg-black">
    <div class="container">
        <div class="card p-5">
            <h5 class="text-center">Login</h5>
            <p id="alert3"></p>
            <!--form-->
            <form class="form-group" id="myForm" onsubmit="return validateForm()" >
                <label>Email</label>
                <input type="email" name="email" class="form-control" id="email">
                <span id="EmailEr" style="color: red;"></span>
                <label>Password</label>
                <input type="password" name="password" class="form-control" id="password">
                <span id="pswEr" style="color: red;"></span>
                <br>
                <button class="btn w-100 p-2" type="submit" ><a href="bbbb.html" class="btn-link">Login</a></button>
            </form>
        </div>
    </div>
</body>
</html>
